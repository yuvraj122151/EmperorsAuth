# MiniMessage format: https://docs.advntr.dev/minimessage/format.html
prefix: "<gradient:#f5c542:#e08a00><bold>Emperors</bold></gradient> <dark_gray>»</dark_gray>"

players-only: "<prefix> <red>Only players can use this command."
no-permission: "<prefix> <red>You don't have permission."
usage-login: "<prefix> <yellow>Usage: <white>/login <password>"
usage-register: "<prefix> <yellow>Usage: <white>/register <password> <confirm>"
usage-changepassword: "<prefix> <yellow>Usage: <white>/changepassword <old> <new>"
usage-unregister: "<prefix> <yellow>Usage: <white>/unregister <password>"
usage-admin: "<prefix> <yellow>Usage: <white>/emperorsauth <reload|info|unregister|setpassword|forcelogin> [player] [password]"

prompt-login: "<prefix> <yellow>Welcome back! Log in with <white>/login <password>"
prompt-register: "<prefix> <yellow>Welcome to Emperors SMP! Register with <white>/register <password> <confirm>"
title-login: "<gold><bold>Welcome back"
subtitle-login: "<gray>Use /login <password>"
title-register: "<gold><bold>Emperors SMP"
subtitle-register: "<gray>Use /register <password> <password>"
bossbar: "<red>Authenticate within <white><seconds>s"
must-login: "<prefix> <red>Log in first to do that."

login-success: "<prefix> <green>Logged in successfully. Enjoy your stay!"
register-success: "<prefix> <green>Account created. You're logged in!"
session-resumed: "<prefix> <green>Session resumed, welcome back!"
forced-login: "<prefix> <green>An admin logged you in."
logged-out: "<prefix> <yellow>You have been logged out."
password-changed: "<prefix> <green>Password changed successfully."
unregistered: "<prefix> <red>Your account has been deleted. Rejoin to register again."

already-logged-in: "<prefix> <red>You are already logged in."
not-logged-in: "<prefix> <red>You are not logged in."
already-registered: "<prefix> <red>You already have an account. Use /login."
not-registered: "<prefix> <red>You are not registered. Use /register."
password-mismatch: "<prefix> <red>The passwords do not match."
password-too-short: "<prefix> <red>Password must be at least <white><min></white> characters."
password-too-long: "<prefix> <red>Password must be at most <white><max></white> characters."
password-is-name: "<prefix> <red>Your password can't be your username."
password-weak: "<prefix> <red>That password is too common. Pick another."
password-no-digit: "<prefix> <red>Password must contain at least one number."
wrong-password: "<prefix> <red>Wrong password! <white><remaining></white> attempt(s) left."
wrong-old-password: "<prefix> <red>Your current password is wrong."
too-many-accounts: "<prefix> <red>Too many accounts registered from your IP."
internal-error: "<prefix> <red>Something went wrong. Please tell an admin."

kick-timeout: "<red>You took too long to log in.<newline><gray>Rejoin and try again."
kick-too-many-attempts: "<red>Too many failed login attempts.<newline><gray>You are locked out for a while."
kick-locked: "<red>Too many failed attempts from your IP.<newline><gray>Try again in <white><minutes></white> minute(s)."
kick-invalid-name: "<red>Invalid username.<newline><gray>Use 3-16 letters, numbers or underscores."
kick-name-case: "<red>Wrong username capitalisation.<newline><gray>Join as <white><name></white>."
kick-error: "<red>Authentication error. Try again shortly."

admin-reloaded: "<prefix> <green>Configuration reloaded."
admin-unregistered: "<prefix> <green>Deleted account of <white><player></white>."
admin-setpassword: "<prefix> <green>Password of <white><player></white> updated."
admin-forcelogin: "<prefix> <green>Forced login for <white><player></white>."
admin-info: "<prefix> <gold>Account <white><player></white><newline><gray>Registered: <white><registered></white><newline><gray>Last login: <white><lastlogin></white><newline><gray>Logins: <white><logins></white><newline><gray>Last IP: <white><ip></white>"
player-offline: "<prefix> <red>That player is not online."
account-not-found: "<prefix> <red>No account found for that name."
